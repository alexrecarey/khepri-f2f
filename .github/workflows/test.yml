name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: corepack enable && corepack prepare yarn@3.3.0 --activate
      - run: yarn install --immutable
      - run: yarn test:js
      - run: yarn build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.12 --with icepool==2.2.2 --with pytest pytest -q src/engine
