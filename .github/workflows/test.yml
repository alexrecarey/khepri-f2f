name: test

on:
  push:
    branches: [main]
  pull_request:

# Tests only read the repository.
permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare yarn@3.3.0 --activate
      - run: yarn install --immutable
      - run: yarn test:js
      # index.json is generated from army.json; a stale one passes the tests
      # (they rebuild it in memory) but ships the old search.
      - run: yarn check-search-index
      - run: yarn build
      - run: yarn check-build

  # The engine's own tests (engine-rs/tests), natively, on the Rust that
  # rust-toolchain.toml pins (installed by name: rustup may not do it itself).
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - run: cargo test --locked
