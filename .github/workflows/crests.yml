name: crests

# Unit crests in R2 (scripts/crests/sync.mjs). Weekly: ask Corvus Belli
# (headers only) whether any crest changed and redo those. By hand (Actions ›
# crests › Run workflow): redo all crests, or the slugs given.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Redownload and reupload (all crests, or just the slugs below)
        type: boolean
        default: false
      slugs:
        description: Crest slugs, space-separated (e.g. squalos-mk-ii-1-1); empty = all
        type: string
        default: ''

permissions:
  contents: read

jobs:
  crests:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare yarn@3.3.0 --activate
      - run: yarn install --immutable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
      - name: Sync
        env:
          FORCE: ${{ inputs.force }}
          SLUGS: ${{ inputs.slugs }}
        run: |
          if [ "$FORCE" = true ]; then
            # shellcheck disable=SC2086 # one argument per slug
            yarn crests --force $SLUGS
          else
            yarn crests --check-changes
          fi
