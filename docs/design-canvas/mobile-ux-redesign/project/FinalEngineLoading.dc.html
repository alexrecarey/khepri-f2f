<style>body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0f0f0f;color:#e8e6e1}
.card{width:358px;background:#1f1f1f;border-radius:20px 20px 0 0;padding:8px 16px 18px;display:flex;flex-direction:column;gap:10px}
.handle{align-self:center;width:40px;height:5px;border-radius:3px;background:#444}
.row{display:flex;justify-content:space-between;align-items:flex-end;height:52px}
.lab{font-size:12px;color:#9a978f}.col{display:flex;flex-direction:column;gap:2px}.col.r{align-items:flex-end}
.bar{height:6px;border-radius:3px;background:#2a2a2a;overflow:hidden;position:relative}
.note{font-size:12px;color:#8a877f}
.t{font-size:15px;font-weight:600}.d{font-size:12px;color:#8a877f;line-height:1.5;width:358px}
/* A tumble */
.tum{animation:tum 1.2s infinite cubic-bezier(.3,1.4,.5,1)}.tum.b{animation-delay:.3s}
@keyframes tum{0%{transform:rotate(0) translateY(0)}35%{transform:rotate(200deg) translateY(-8px)}60%,100%{transform:rotate(360deg) translateY(0)}}
/* B shimmer */
.shim path{animation:sh 1.6s infinite}@keyframes sh{0%,100%{opacity:.25}50%{opacity:1}}
.shim.b path{animation-delay:.8s}
.sweep{position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff18,transparent);animation:sw 1.6s infinite}@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* C slot numbers */
.slot{height:34px;overflow:hidden;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:34px;line-height:34px}
.slot span{display:flex;flex-direction:column;animation:sl 1s infinite steps(10)}@keyframes sl{to{transform:translateY(-340px)}}
.slot.b span{animation-duration:1.3s}
/* D clash */
.clash{position:relative;height:40px}.ca{position:absolute;left:0;top:3px;animation:ca 1.6s infinite cubic-bezier(.5,0,.3,1)}.cb{position:absolute;right:0;top:3px;animation:cb 1.6s infinite cubic-bezier(.5,0,.3,1)}
@keyframes ca{0%,100%{transform:translateX(0) rotate(0)}45%{transform:translateX(130px) rotate(270deg)}55%{transform:translateX(130px) rotate(270deg)}}
@keyframes cb{0%,100%{transform:translateX(0) rotate(0)}45%{transform:translateX(-130px) rotate(-270deg)}55%{transform:translateX(-130px) rotate(-270deg)}}
/* E progress */
.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5fc4a0,#e59bc0);animation:fl 4s infinite cubic-bezier(.2,.8,.2,1)}@keyframes fl{0%{width:0}25%{width:30%}60%{width:70%}90%,100%{width:100%}}
.steps span{animation:st 4s infinite;opacity:0;position:absolute}.steps span:nth-child(2){animation-delay:1.3s}.steps span:nth-child(3){animation-delay:2.6s}
@keyframes st{0%{opacity:0}5%,28%{opacity:1}33%,100%{opacity:0}}
/* F one die, d20 face count */
.face{position:relative;width:52px;height:52px}.face svg{position:absolute;inset:0;animation:tum 1.1s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></helmet>
