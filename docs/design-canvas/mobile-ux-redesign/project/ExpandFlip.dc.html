<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expand B, card flips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#121212;color:#e8e6e1}
a{color:#5fc4a0}a:hover{color:#8fe0c2}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#121212;display:flex;flex-direction:column">
<div style="padding:56px 16px 0;display:flex;flex-direction:column;gap:10px">

<section style="height:190px;box-sizing:border-box;padding:12px 14px;border-radius:14px;background:#1c1c1c;border:1px solid #2f4a40;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline">
<span style="font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.1em;color:#5fc4a0;flex-grow:1">SQUALO · MODS</span>
<button aria-label="Back to setup" style="all:unset;cursor:pointer;font-size:12px;color:#8a877f">↺ setup</button>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-family:'IBM Plex Mono',monospace;font-size:12px">
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-family:'IBM Plex Sans',sans-serif;font-size:10px;letter-spacing:.12em;color:#8a877f">BURST</span>
<span>4 HMG</span>
<span style="border-top:1px solid #333;padding-top:3px;font-weight:600;font-size:15px">B4</span>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-family:'IBM Plex Sans',sans-serif;font-size:10px;letter-spacing:.12em;color:#8a877f">SV</span>
<span>14 BS</span>
<span style="color:#5fc4a0">+3 range</span>
<span style="color:#e59bc0">−3 cover</span>
<span style="color:#6b6861;text-decoration:line-through">−3 mimet.</span>
<span style="border-top:1px solid #333;padding-top:3px;font-weight:600;font-size:15px">SV14</span>
</div>
<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-family:'IBM Plex Sans',sans-serif;font-size:10px;letter-spacing:.12em;color:#8a877f">PS</span>
<span>5 HMG</span>
<span style="color:#e59bc0">+1 ARM</span>
<span style="color:#e59bc0">+3 cover</span>
<span style="color:transparent">·</span>
<span style="border-top:1px solid #333;padding-top:3px;font-weight:600;font-size:15px">PS9</span>
</div>
</div>
</section>

<span style="font-size:12px;color:#6b6861;text-align:center">Same card, same height: tap the corner to flip between setup and mods</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
