<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peek A bar thickness</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#121212;color:#e8e6e1}
a{color:#5fc4a0}a:hover{color:#8fe0c2}
</style>
</helmet>
<div style="width:390px;height:1000px;box-sizing:border-box;background:#121212;padding:24px 0;display:flex;flex-direction:column;gap:22px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:6px">
<span style="padding:0 16px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6b6861">{{b.label}}</span>
<div style="display:flex;flex-direction:column;gap:10px;margin:0 8px;padding:8px 16px 24px;border-radius:20px;background:#1f1f1f">
<span style="align-self:center;width:40px;height:5px;border-radius:3px;background:#444"></span>
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<div style="display:flex;flex-direction:column"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#5fc4a0;line-height:1">1.04</span><span style="font-size:12px;color:#9a978f">Squalo wounds / order</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#e59bc0;line-height:1">0.28</span><span style="font-size:12px;color:#9a978f">Fennec wounds back</span></div>
</div>
<div style="display:flex;height:{{b.h}}px;border-radius:{{b.r}}px;overflow:hidden">
<span style="width:10.5%;background:#8fe0c2"></span><span style="width:19.9%;background:#5fc4a0"></span><span style="width:30.1%;background:#3a9a7a"></span><span style="width:22.9%;background:#2e2e2e"></span><span style="width:8.1%;background:#a8457a"></span><span style="width:6.3%;background:#d06fa0"></span><span style="width:2.2%;background:#e59bc0"></span>
</div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#8a877f"><span>60.5% at least one wound</span><span>16.6%</span></div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { bars: [
      { label: '16 px', h: 16, r: 5 },
      { label: '10 px', h: 10, r: 4 },
      { label: '6 px', h: 6, r: 3 },
      { label: '4 px — same as the old F2F line', h: 4, r: 2 }
    ] };
  }
}
</script>
</body>
</html>
