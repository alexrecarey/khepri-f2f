</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
var ROWS = ["squalos-mk-ii", "fusiliers", "zhanshi", "intruders", "ghulam-infantry", "morat-vanguard-infantry"];
// Rows are unrolled in the markup: the canvas only resolves literal relative image paths, not {{holes}}.
// The infinitystats row treatment as-is: every result carries its crest, faint and in one neutral ink so
// the list stays calm; the highlighted row (keyboard focus / the one Enter would pick) gets its colours.
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    var self = this, sel = this.state.sel;
    var out = {};
    ROWS.forEach(function (r, i) {
      var on = i === sel;
      out['r' + i] = {
        bg: on ? '#1c1c1c' : 'transparent', op: on ? 0.45 : 0.14, filter: on ? 'none' : 'url(#ink-n)',
        pick: function () { self.setState({ sel: i }); } };
    });
    return out;
  }
}
</script>
