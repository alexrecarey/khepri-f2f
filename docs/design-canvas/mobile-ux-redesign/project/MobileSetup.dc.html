<span style="flex-grow:1;height:1px;background:#2c2c2c"></span>
<button style="all:unset;cursor:pointer;padding:10px 14px;border-radius:999px;border:1px solid #333;color:#c9c6bf">24–32" ▾</button>

<button style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:#1c1c1c">
<span style="font-family:'Chakra Petch',sans-serif;font-size:13px;letter-spacing:.1em;color:#e59bc0">REACTIVE</span>

<span style="font-size:14px;color:#c9c6bf">Missile Launcher · PanOceania</span>
<span style="font-size:13px;color:#8a877f;margin-top:4px">Tap to change trooper</span>
</button>

<div style="flex-grow:1"></div>

<div style="background:#1c1c1c;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;font-family:'Chakra Petch',sans-serif;font-size:22px;font-weight:700">

</div>

</div>
