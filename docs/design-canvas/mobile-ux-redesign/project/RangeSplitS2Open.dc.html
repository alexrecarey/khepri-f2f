<div style="display:flex;align-items:center;gap:8px">

<sc-if value="{{noZone}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 15h8.5a3.2 3.2 0 0 0 .3-6.4A4.5 4.5 0 0 0 5.8 8 3.5 3.5 0 0 0 5.5 15z"></path></svg></sc-if>
</button>
<span style="width:28px;height:44px;flex-shrink:0;display:grid;place-items:center;font-size:18px;color:#c9c6bf">⇅</span>
</div>
<div style="overflow:hidden;transition:max-height .28s ease, opacity .2s ease;max-height:{{footH}};opacity:{{openO}}">

<div style="margin-left:auto;display:flex;gap:8px;flex-shrink:0;font-size:11px;color:#8a877f"><span><span style="display:inline-block;width:10px;height:4px;background:#58b368;vertical-align:middle"></span> +3</span><span><span style="display:inline-block;width:10px;height:4px;background:#4a8fd6;vertical-align:middle"></span> 0</span><span><span style="display:inline-block;width:10px;height:4px;background:#e3c34a;vertical-align:middle"></span> −3</span><span><span style="display:inline-block;width:10px;height:4px;background:#d9534f;vertical-align:middle"></span> −6</span></div>

<div style="display:flex;justify-content:flex-end;gap:6px;padding:0 12px 10px"><button onClick="{{toggleSplit}}" aria-pressed="{{splitPressed}}" style="all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;font-size:12px;border:1px solid {{spBd}};background:{{spBg}};color:{{spFg}}"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h14M7 6l3-3 3 3M7 14l3 3 3-3"></path></svg>Split range</button><button onClick="{{toggle.smoke}}" aria-pressed="{{on.smoke}}" style="all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;font-size:12px;border:1px solid {{hBd2.smoke}};background:{{tileBg2.smoke}};color:{{tileFg2.smoke}}"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 15h8.5a3.2 3.2 0 0 0 .3-6.4A4.5 4.5 0 0 0 5.8 8 3.5 3.5 0 0 0 5.5 15z"></path></svg>Smoke</button><button onClick="{{toggle.wn}}" aria-pressed="{{on.wn}}" style="all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;font-size:12px;border:1px solid {{hBd2.wn}};background:{{tileBg2.wn}};color:{{tileFg2.wn}}"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10h2.5l1.5-4 2 8 2-10 2 12 2-8 1.5 2H18"></path></svg>White Noise</button></div></div>
</div>

<section style="padding:14px;border-radius:14px;background:#1c1c1c;display:flex;flex-direction:column;gap:10px">
<button style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.1em;color:#e59bc0">REACTIVE</span>
<span style="font-size:18px;font-weight:600">Fennec Fusiliers <span style="font-size:13px;font-weight:400;color:#8a877f">PanOceania ›</span></span>

<div style="display:flex;gap:6px;flex-wrap:wrap">
<button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;background:#e59bc0;color:#2a0f1d;font-size:14px;font-weight:600">Missile L.</button>
<button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">Pistol</button>
<button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">Dodge</button>

<div style="display:flex;gap:6px;flex-wrap:wrap">
<button style="all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:#3a2330;border:1px solid #e59bc0;font-size:13px">Cover ✓</button>
<button style="all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:#3a2330;border:1px solid #e59bc0;font-size:13px">Fireteam 5</button>

<div style="flex-grow:1"></div>
</div>

<a href="FinalResults.dc.html" style="display:flex;flex-direction:column;gap:10px;margin:0 8px;padding:8px 16px 24px;border-radius:20px 20px 0 0;background:#1f1f1f;text-decoration:none;color:#e8e6e1">

<div style="display:flex;justify-content:space-between;align-items:flex-end">

<div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#e59bc0;line-height:1">0.46</span><span style="font-size:12px;color:#9a978f">wounds / order</span></div>

<div style="display:flex;justify-content:space-between;font-size:12px;color:#8a877f"><span>47.7% at least one wound</span><span>28.6%</span></div>

<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
var BANDS = ['8', '16', '24', '32', '40', '48', '96'];
var HMG = [-3, 0, 3, 3, -3, -6, null];
var ML = [-3, 0, 0, 3, 3, -3, -6];
var IC = { '3': '#58b368', '0': '#4a8fd6', '-3': '#e3c34a', '-6': '#d9534f' };
var GREEN = '#5fc4a0', PINK = '#e59bc0', GREEN_INK = '#0f1f19', PINK_INK = '#2a0f1d', GREEN_DIM = '#1f3a31', PINK_DIM = '#3a2330';
function col(m) { return m == null ? 'transparent' : IC[String(m)]; }
function fmt(n) { return n === null ? '—' : n > 0 ? '+' + n : n < 0 ? '−' + (-n) : '0'; }
function lab(r) { return (r ? BANDS[r - 1] : '0') + '–' + BANDS[r]; }
var NAMES = { smoke: 'Smoke', wn: 'White Noise' };
function zoneText(z) {
  var a = '', b = '';
  if (z.smoke && z.wn) { a = ' · no LoF'; b = ' · no LoF'; }
  else if (z.smoke) { a = ' · smoke 0 (MSV2)'; b = ' · smoke −6'; }
  else if (z.wn) { a = ' · white noise −6'; b = ' · white noise 0'; }
  return { a: a, b: b };
}
// The Squalos shoots at 24–32", the Fennec answers a different trooper's
// distance (32–40") once the range is split. Unsplitting keeps the active's.
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var o = props && props.startOpen !== undefined ? props.startOpen : true;
    this.state = { rA: 3, rB: 4, split: true, open: o, smoke: false, wn: false };
  }
  renderVals() {
    var self = this, st = this.state, z = { smoke: st.smoke, wn: st.wn }, any = z.smoke || z.wn, open = st.open;
    var rA = st.rA, rB = st.split ? st.rB : st.rA;
    function flip(k) { return function () { var s = {}; s[k] = !st[k]; self.setState(s); }; }
    var keys = ['smoke', 'wn'], m = { on: {}, on2: {}, tileBg2: {}, tileFg2: {}, hBd2: {} };
    keys.forEach(function (k) {
      var on = z[k];
      m.on[k] = on ? 'true' : 'false'; m.on2[k] = on;
      m.tileBg2[k] = on ? '#2e2e2e' : 'transparent'; m.tileFg2[k] = on ? '#e8e6e1' : '#8a877f'; m.hBd2[k] = on ? '#8a877f' : '#2c2c2c';
    });
    var zt = zoneText(z);
    function pickA(i) { return function () { self.setState(st.split ? { rA: i, open: true } : { rA: i, rB: i, open: true }); }; }
    function pickB(i) { return function () { self.setState({ rB: i, open: true }); }; }
    return Object.assign(m, {
      openIt: function () { self.setState({ open: true }); },
      noZone: !any, anyZone: any, slotFg: any ? '#e8e6e1' : '#555',
      rangeBg: open ? '#1c1c1c' : 'transparent', headH: open ? '48px' : '0px', footH: open ? '200px' : '0px', openO: open ? 1 : 0,
      close: function () { self.setState({ open: false }); },
      rangeIsOpen: open, split: st.split, notSplit: !st.split, splitOpen: st.split && open, splitClosed: st.split && !open,
      rangeLabel: lab(rA), labelA: lab(rA), labelB: lab(rB),
      nameA: 'HMG', nameB: 'Missile L.', modA: fmt(HMG[rA]), modB: fmt(ML[rB]), zA: zt.a, zB: zt.b,
      toggle: { smoke: flip('smoke'), wn: flip('wn') },
      toggleSplit: function () { self.setState(st.split ? { split: false, rB: st.rA } : { split: true, rB: st.rA }); },
      splitPressed: st.split ? 'true' : 'false',
      spBg: st.split ? '#2e2e2e' : 'transparent', spFg: st.split ? '#e8e6e1' : '#8a877f', spBd: st.split ? '#8a877f' : '#2c2c2c',
      trackH: open ? '22px' : '6px',
      bands: BANDS.map(function (to, i) {
        var sel = i === rA;
        return { label: sel ? to + '"' : to, aCol: open ? col(HMG[i]) : 'transparent', rCol: open ? col(ML[i]) : 'transparent',
          bg: sel ? '#e8e6e1' : 'transparent', fg: sel ? '#121212' : '#9a978f', fw: sel ? 700 : 400, pick: pickA(i) };
      }),
      bandsA: BANDS.map(function (to, i) {
        var sel = i === rA;
        return { label: sel ? to + '"' : to, col: open ? col(HMG[i]) : 'transparent', aria: 'HMG range up to ' + to + '"',
          bg: sel ? GREEN : 'transparent', fg: sel ? GREEN_INK : '#9a978f', fw: sel ? 700 : 400, pick: pickA(i) };
      }),
      bandsB: BANDS.map(function (to, i) {
        var sel = i === rB;
        return { label: sel ? to + '"' : to, col: open ? col(ML[i]) : 'transparent', aria: 'Missile L. range up to ' + to + '"',
          bg: sel ? PINK : 'transparent', fg: sel ? PINK_INK : '#9a978f', fw: sel ? 700 : 400, pick: pickB(i) };
      }),
      bandsM: BANDS.map(function (to, i) {
        var a = i === rA, b = i === rB;
        return { label: a || b ? to + '"' : to, top: a ? GREEN : 'transparent', bot: b ? PINK : 'transparent',
          bg: a && b ? 'linear-gradient(' + GREEN_DIM + ' 50%, ' + PINK_DIM + ' 50%)' : a ? GREEN_DIM : b ? PINK_DIM : 'transparent',
          fg: a || b ? '#e8e6e1' : '#9a978f', fw: a || b ? 700 : 400,
          aria: (a ? 'HMG ' : '') + (b ? 'Missile L. ' : '') + 'up to ' + to + '"; open range' };
      }),
      bandsS: BANDS.map(function (to, i) {
        var a = i === rA, b = i === rB, first = i === 0, last = i === BANDS.length - 1;
        return { label: a || b ? to + '"' : to, fg: a || b ? '#e8e6e1' : '#9a978f', fw: a || b ? 700 : 400,
          bgA: a ? GREEN : open ? '#1f1f1f' : '#2a2a2a', bgB: b ? PINK : open ? '#1f1f1f' : '#2a2a2a',
          colA: open ? col(HMG[i]) : 'transparent', colB: open ? col(ML[i]) : 'transparent',
          radA: first ? '6px 2px 2px 2px' : last ? '2px 6px 2px 2px' : '2px',
          radB: first ? '2px 2px 2px 6px' : last ? '2px 2px 6px 2px' : '2px',
          pickA: pickA(i), pickB: pickB(i),
          ariaA: 'HMG range up to ' + to + '"', ariaB: 'Missile L. range up to ' + to + '"' };
      })
    });
  }
}
</script>
</body>
</html>
