<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShareCardC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#121212;color:#e8e6e1}
a{color:#5fc4a0}a:hover{color:#8fe0c2}
</style>
</helmet>
<div style="width:1200px;height:630px;box-sizing:border-box;position:relative;overflow:hidden;background:#121212;display:flex;flex-direction:column;padding:40px 56px 40px;gap:26px">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:24px">
<div style="display:flex;flex-direction:column;min-width:0"><span style="font-size:48px;font-weight:600;line-height:1.1">Squalos Mk-II</span><span style="font-size:32px;color:#9a978f">HMG · Surprise attack</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-end;text-align:right;min-width:0"><span style="font-size:48px;font-weight:600;line-height:1.1">Zhanshi</span><span style="font-size:32px;color:#9a978f">Missile L. · Cover · FT 5</span></div>
</div>
<div style="flex-grow:1;display:flex;border-radius:18px;overflow:hidden">
<div style="width:47.6%;background:#5fc4a0;color:#121212;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:104px;font-weight:700;line-height:1">48%</span>
<span style="font-size:32px;font-weight:600">Squalos hits</span></div>
<div style="width:23.7%;background:#2e2e2e;color:#e8e6e1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:104px;font-weight:700;line-height:1">24%</span>
<span style="font-size:32px;font-weight:600">no one</span></div>
<div style="width:28.7%;background:#e59bc0;color:#121212;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:104px;font-weight:700;line-height:1">29%</span>
<span style="font-size:32px;font-weight:600">Zhanshi hits</span></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="font-family:'Chakra Petch',sans-serif;font-size:28px;font-weight:600;letter-spacing:.12em;color:#9a978f">INFINITY THE CALCULATOR</span>
<span style="font-size:32px;color:#9a978f">16–24″ · <span style="color:#5fc4a0">0.81</span> vs <span style="color:#e59bc0">0.46</span> wounds / order</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1200, "height": 630}}'>
// Share card exploration (Discord / WhatsApp). Flat fills, text and crest images only:
// the real card is drawn per link by the Worker, so no filters or masks.
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
