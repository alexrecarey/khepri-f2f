<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic calculator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#121212;color:#e8e6e1}
a{color:#5fc4a0}a:hover{color:#8fe0c2}
</style>
</helmet>
<div style="width:390px;height:1560px;box-sizing:border-box;background:#121212;display:flex;flex-direction:column;position:relative">

<header style="display:flex;align-items:center;padding:6px 8px 0 16px;height:48px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;color:#6b6861;flex-grow:1">INFINITY THE CALCULATOR <span style="color:#8a877f">· CLASSIC</span></span>
<a href="FinalMenu.dc.html" aria-label="Menu" style="width:44px;height:44px;display:grid;place-items:center;color:#9a978f">
<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.8"></circle><circle cx="10" cy="10" r="1.8"></circle><circle cx="16" cy="10" r="1.8"></circle></svg>
</a>
</header>

<div style="padding:4px 16px 190px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{sides}}" as="s" hint-placeholder-count="2">
<section style="padding:14px;border-radius:14px;background:#1c1c1c;display:flex;flex-direction:column;gap:14px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:13px;letter-spacing:.1em;color:{{s.color}}">{{s.title}}</span>

<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a877f">Burst</span>
<div style="display:flex;gap:2px;align-items:center">
<sc-for list="{{s.burst}}" as="d" hint-placeholder-count="6">
<svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true" style="padding:2px;opacity:{{d.op}}"><path fill="{{d.fill}}" d="M64.7 125.8l53.2 31.9c7.8 4.7 17.8 2 22.2-5.9L217.6 12.1c3-5.4-.9-12.1-7.1-12.1c-1.6 0-3.2 .5-4.6 1.4L63.9 98.8c-9.6 6.6-9.2 20.9 .8 26.9zM32 171.7V295.3c0 8 10.4 11 14.7 4.4l60-92c5-7.6 2.6-17.8-5.2-22.5L56.2 158C45.6 151.6 32 159.3 32 171.7zM326.4 12.1l77.6 139.6c4.4 7.9 14.5 10.6 22.2 5.9l53.2-31.9c10-6 10.4-20.3 .8-26.9L338.1 1.4c-1.4-.9-3-1.4-4.6-1.4c-6.2 0-10.1 6.7-7.1 12.1zM512 171.7c0-12.4-13.6-20.1-24.2-13.7l-45.3 27.2c-7.8 4.7-10.1 14.9-5.2 22.5l60 92c4.3 6.7 14.7 3.6 14.7-4.4V171.7zm-49.3 246L302.1 436.6c-8.1 .9-14.1 7.8-14.1 15.9v52.8c0 3.7 3 6.8 6.8 6.8c.8 0 1.6-.1 2.4-.4l172.7-64c6.1-2.2 10.1-8 10.1-14.5c0-9.3-8.1-16.5-17.3-15.4zM249.2 512c3.7 0 6.8-3 6.8-6.8V452.6c0-8.1-6.1-14.9-14.1-15.9l-160.6-19c-9.2-1.1-17.3 6.1-17.3 15.4c0 6.5 4 12.3 10.1 14.5l172.7 64c.8 .3 1.6 .4 2.4 .4zM57.7 382.9l170.9 20.2c7.8 .9 13.4-7.5 9.5-14.3l-85.7-150c-5.9-10.4-20.7-10.8-27.3-.8L46.2 358.2c-6.5 9.9-.3 23.3 11.5 24.7zm439.6-24.8L418.9 238.1c-6.5-10-21.4-9.6-27.3 .8L306.2 388.5c-3.9 6.8 1.6 15.2 9.5 14.3l170.1-20c11.8-1.4 18-14.7 11.5-24.6zm-216.9 11l78.4-137.2c6.1-10.7-1.6-23.9-13.9-23.9H199.1c-12.3 0-20 13.3-13.9 23.9l78.4 137.2c3.7 6.4 13 6.4 16.7 0zM190.4 176H353.6c12.2 0 19.9-13.1 14-23.8l-80-144c-2.8-5.1-8.2-8.2-14-8.2h-3.2c-5.8 0-11.2 3.2-14 8.2l-80 144c-5.9 10.7 1.8 23.8 14 23.8z"></path></svg>
</sc-for>
<sc-if value="{{s.canZero}}" hint-placeholder-val="{{false}}"><button aria-label="Zero burst, unopposed" style="all:unset;cursor:pointer;margin-left:auto;width:40px;height:40px;display:grid;place-items:center"><svg width="30" height="30" viewBox="0 0 512 512" aria-hidden="true"><path fill="#6b6861" d="M64.7 125.8l53.2 31.9c7.8 4.7 17.8 2 22.2-5.9L217.6 12.1c3-5.4-.9-12.1-7.1-12.1c-1.6 0-3.2 .5-4.6 1.4L63.9 98.8c-9.6 6.6-9.2 20.9 .8 26.9zM32 171.7V295.3c0 8 10.4 11 14.7 4.4l60-92c5-7.6 2.6-17.8-5.2-22.5L56.2 158C45.6 151.6 32 159.3 32 171.7zM326.4 12.1l77.6 139.6c4.4 7.9 14.5 10.6 22.2 5.9l53.2-31.9c10-6 10.4-20.3 .8-26.9L338.1 1.4c-1.4-.9-3-1.4-4.6-1.4c-6.2 0-10.1 6.7-7.1 12.1zM512 171.7c0-12.4-13.6-20.1-24.2-13.7l-45.3 27.2c-7.8 4.7-10.1 14.9-5.2 22.5l60 92c4.3 6.7 14.7 3.6 14.7-4.4V171.7zm-49.3 246L302.1 436.6c-8.1 .9-14.1 7.8-14.1 15.9v52.8c0 3.7 3 6.8 6.8 6.8c.8 0 1.6-.1 2.4-.4l172.7-64c6.1-2.2 10.1-8 10.1-14.5c0-9.3-8.1-16.5-17.3-15.4zM249.2 512c3.7 0 6.8-3 6.8-6.8V452.6c0-8.1-6.1-14.9-14.1-15.9l-160.6-19c-9.2-1.1-17.3 6.1-17.3 15.4c0 6.5 4 12.3 10.1 14.5l172.7 64c.8 .3 1.6 .4 2.4 .4zM57.7 382.9l170.9 20.2c7.8 .9 13.4-7.5 9.5-14.3l-85.7-150c-5.9-10.4-20.7-10.8-27.3-.8L46.2 358.2c-6.5 9.9-.3 23.3 11.5 24.7zm439.6-24.8L418.9 238.1c-6.5-10-21.4-9.6-27.3 .8L306.2 388.5c-3.9 6.8 1.6 15.2 9.5 14.3l170.1-20c11.8-1.4 18-14.7 11.5-24.6zm-216.9 11l78.4-137.2c6.1-10.7-1.6-23.9-13.9-23.9H199.1c-12.3 0-20 13.3-13.9 23.9l78.4 137.2c3.7 6.4 13 6.4 16.7 0zM190.4 176H353.6c12.2 0 19.9-13.1 14-23.8l-80-144c-2.8-5.1-8.2-8.2-14-8.2h-3.2c-5.8 0-11.2 3.2-14 8.2l-80 144c-5.9 10.7 1.8 23.8 14 23.8z"></path><path d="M40 472 L472 40" stroke="#121212" stroke-width="64"></path><path d="M40 472 L472 40" stroke="#9a978f" stroke-width="28" stroke-linecap="round"></path></svg></button></sc-if>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a877f">Special dice</span>
<div style="display:flex;gap:2px">
<sc-for list="{{s.special}}" as="d" hint-placeholder-count="3">
<svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true" style="padding:2px;opacity:{{d.op}}"><path fill="{{d.fill}}" d="M64.7 125.8l53.2 31.9c7.8 4.7 17.8 2 22.2-5.9L217.6 12.1c3-5.4-.9-12.1-7.1-12.1c-1.6 0-3.2 .5-4.6 1.4L63.9 98.8c-9.6 6.6-9.2 20.9 .8 26.9zM32 171.7V295.3c0 8 10.4 11 14.7 4.4l60-92c5-7.6 2.6-17.8-5.2-22.5L56.2 158C45.6 151.6 32 159.3 32 171.7zM326.4 12.1l77.6 139.6c4.4 7.9 14.5 10.6 22.2 5.9l53.2-31.9c10-6 10.4-20.3 .8-26.9L338.1 1.4c-1.4-.9-3-1.4-4.6-1.4c-6.2 0-10.1 6.7-7.1 12.1zM512 171.7c0-12.4-13.6-20.1-24.2-13.7l-45.3 27.2c-7.8 4.7-10.1 14.9-5.2 22.5l60 92c4.3 6.7 14.7 3.6 14.7-4.4V171.7zm-49.3 246L302.1 436.6c-8.1 .9-14.1 7.8-14.1 15.9v52.8c0 3.7 3 6.8 6.8 6.8c.8 0 1.6-.1 2.4-.4l172.7-64c6.1-2.2 10.1-8 10.1-14.5c0-9.3-8.1-16.5-17.3-15.4zM249.2 512c3.7 0 6.8-3 6.8-6.8V452.6c0-8.1-6.1-14.9-14.1-15.9l-160.6-19c-9.2-1.1-17.3 6.1-17.3 15.4c0 6.5 4 12.3 10.1 14.5l172.7 64c.8 .3 1.6 .4 2.4 .4zM57.7 382.9l170.9 20.2c7.8 .9 13.4-7.5 9.5-14.3l-85.7-150c-5.9-10.4-20.7-10.8-27.3-.8L46.2 358.2c-6.5 9.9-.3 23.3 11.5 24.7zm439.6-24.8L418.9 238.1c-6.5-10-21.4-9.6-27.3 .8L306.2 388.5c-3.9 6.8 1.6 15.2 9.5 14.3l170.1-20c11.8-1.4 18-14.7 11.5-24.6zm-216.9 11l78.4-137.2c6.1-10.7-1.6-23.9-13.9-23.9H199.1c-12.3 0-20 13.3-13.9 23.9l78.4 137.2c3.7 6.4 13 6.4 16.7 0zM190.4 176H353.6c12.2 0 19.9-13.1 14-23.8l-80-144c-2.8-5.1-8.2-8.2-14-8.2h-3.2c-5.8 0-11.2 3.2-14 8.2l-80 144c-5.9 10.7 1.8 23.8 14 23.8z"></path></svg>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;border-top:1px solid #2a2a2a">
<sc-for list="{{s.steppers}}" as="t" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:4px;padding:10px 0;border-bottom:1px solid #2a2a2a">
<span style="font-size:14px;flex-grow:1">{{t.label}}</span>
<button aria-label="Minus 3" style="all:unset;cursor:pointer;width:38px;height:40px;display:grid;place-items:center;border-radius:10px;background:#262626;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#c9c6bf">−3</button>
<button aria-label="Minus 1" style="all:unset;cursor:pointer;width:38px;height:40px;display:grid;place-items:center;border-radius:10px;background:#262626;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#c9c6bf">−1</button>
<span style="width:40px;text-align:center;font-family:'Chakra Petch',sans-serif;font-size:24px;font-weight:700;color:{{s.color}}">{{t.v}}</span>
<button aria-label="Plus 1" style="all:unset;cursor:pointer;width:38px;height:40px;display:grid;place-items:center;border-radius:10px;background:#262626;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#c9c6bf">+1</button>
<button aria-label="Plus 3" style="all:unset;cursor:pointer;width:38px;height:40px;display:grid;place-items:center;border-radius:10px;background:#262626;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#c9c6bf">+3</button>
</div>
</sc-for>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8a877f">Ammunition</span>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<sc-for list="{{s.ammo}}" as="a" hint-placeholder-count="6">
<sc-if value="{{a.on}}" hint-placeholder-val="{{false}}"><span style="padding:8px 12px;border-radius:8px;background:{{s.color}};color:#121212;font-size:14px;font-weight:600">{{a.name}}</span></sc-if>
<sc-if value="{{a.off}}" hint-placeholder-val="{{true}}"><span style="padding:8px 12px;border-radius:8px;background:#262626;color:#c9c6bf;font-size:14px">{{a.name}}</span></sc-if>
</sc-for>
</div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:6px">
<sc-for list="{{s.toggles}}" as="o" hint-placeholder-count="3">
<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><span style="padding:8px 12px;border-radius:999px;background:{{s.tint}};border:1px solid {{s.color}};font-size:13px">{{o.name}} ✓</span></sc-if>
<sc-if value="{{o.off}}" hint-placeholder-val="{{true}}"><span style="padding:8px 12px;border-radius:999px;border:1px solid #3a3a3a;color:#c9c6bf;font-size:13px">{{o.name}}</span></sc-if>
</sc-for>
</div>
</section>
</sc-for>
</div>

<a href="FinalClassicResults.dc.html" style="position:absolute;left:8px;right:8px;bottom:0;display:flex;flex-direction:column;gap:10px;padding:8px 16px 24px;border-radius:20px 20px 0 0;background:#1f1f1f;box-shadow:0 -8px 24px rgba(0,0,0,.45);text-decoration:none;color:#e8e6e1">
<span style="align-self:center;width:40px;height:5px;border-radius:3px;background:#444"></span>
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<div style="display:flex;flex-direction:column"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#5fc4a0;line-height:1">1.04</span><span style="font-size:12px;color:#9a978f">wounds / order</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#e59bc0;line-height:1">0.28</span><span style="font-size:12px;color:#9a978f">wounds / order</span></div>
</div>
<div style="display:flex;height:6px;border-radius:3px;overflow:hidden">
<span style="width:10.5%;background:#8fe0c2"></span><span style="width:19.9%;background:#5fc4a0"></span><span style="width:30.1%;background:#3a9a7a"></span><span style="width:22.9%;background:#2e2e2e"></span><span style="width:8.1%;background:#a8457a"></span><span style="width:6.3%;background:#d06fa0"></span><span style="width:2.2%;background:#e59bc0"></span>
</div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#8a877f"><span>60.5% at least one wound</span><span>16.6%</span></div>
</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
var AMMO = ['N', 'DA', 'EXP', 'T2', 'PLASMA', 'Dodge', 'CONT'];
function dice(n, max, color) {
  var out = [];
  for (var i = 1; i <= max; i++) out.push({ n: i, fill: i <= n ? color : '#e8e6e1', op: i <= n ? 1 : 0.25 });
  return out;
}
function side(title, color, tint, burst, special, sv, ps, ammo, canZero, crit) {
  return {
    title: title, color: color, tint: tint, canZero: canZero,
    burst: dice(burst, 6, color), special: dice(special, 3, color),
    steppers: [
      { label: 'Success Value', hint: 'after all mods · over 20 crits from 1', v: sv }
    ].concat(Array.isArray(ps)
      // Plasma: the opponent saves twice, once with ARM and once with BTS
      ? [{ label: 'Opponent PS ARM', hint: 'your PS + their ARM, cover included', v: ps[0] },
         { label: 'Opponent PS BTS', hint: 'your PS + their BTS', v: ps[1] }]
      : [{ label: 'Opponent PS', hint: 'your PS + their ARM, cover included', v: ps }]),
    ammo: AMMO.map(function (a) { return { name: a, on: a === ammo, off: a !== ammo }; }),
    toggles: [
      { name: 'Immunity (Critical)', on: crit, off: !crit },
      { name: 'Direct Template', on: false, off: true },
      { name: 'Fixed value die (AC2)', on: false, off: true }
    ]
  };
}
class Component extends DCLogic {
  renderVals() {
    return { sides: [
      side('ACTIVE', '#5fc4a0', '#1f3a31', 4, 0, 14, 9, 'N', false, false),
      side('REACTIVE', '#e59bc0', '#3a2330', 2, 0, 13, 12, 'EXP', true, false)
    ] };
  }
}
</script>
</body>
</html>
