<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.8"></circle><circle cx="10" cy="10" r="1.8"></circle><circle cx="16" cy="10" r="1.8"></circle></svg>
</button>

</button>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;background:#5fc4a0;color:#0f1f19;font-size:14px;font-weight:600">HMG</button><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">Grenade L.</button><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">MULTI Pistol</button><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">CC</button></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button style="all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px dashed #3a3a3a;color:#9a978f;font-size:13px">+ Cover</button><button style="all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:#1f3a31;border:1px solid #5fc4a0;font-size:13px">Surprise attack ✓</button></div>
</div>
</section>
<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex-grow:1;border:1px solid #2c2c2c;border-radius:10px;overflow:hidden"><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:400;background:transparent;color:#9a978f">8</span><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:400;background:transparent;color:#9a978f">16</span><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:700;background:#e8e6e1;color:#121212">24"</span><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:400;background:transparent;color:#9a978f">32</span><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:400;background:transparent;color:#9a978f">40</span><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:400;background:transparent;color:#9a978f">48</span><span style="text-align:center;padding:9px 0;font-size:12px;font-weight:400;background:transparent;color:#9a978f">96</span></div><span style="width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;border-radius:999px;border:1px solid #333;color:#c9c6bf">⇅</span></div>
<section style="position:relative;overflow:hidden;isolation:isolate;padding:14px;border-radius:14px;background:#1c1c1c;display:flex;flex-direction:column;gap:10px">
<img src="crests/zhanshi.svg" alt="" aria-hidden="true" style="position:absolute;z-index:0;right:-46px;top:50%;width:188px;height:188px;margin-top:-94px;pointer-events:none;opacity:{{b.op}};filter:{{b.filter}};transition:opacity .18s ease, filter .18s ease;-webkit-mask-image:linear-gradient(270deg,#000 20%,transparent 88%);mask-image:linear-gradient(270deg,#000 20%,transparent 88%)">
<div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:10px">
<button onClick="{{b.tap}}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px">
<span style="font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.1em;color:#e59bc0">REACTIVE</span>
<span style="font-size:18px;font-weight:600">Zhanshi <span style="font-size:13px;font-weight:400;color:#8a877f">Yu Jing ›</span></span>
</button>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;background:#e59bc0;color:#2a0f1d;font-size:14px;font-weight:600">Missile L.</button><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">Pistol</button><button style="all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid #333;font-size:14px;color:#c9c6bf">Dodge</button></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button style="all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:#3a2330;border:1px solid #e59bc0;font-size:13px">Cover ✓</button><button style="all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;background:#3a2330;border:1px solid #e59bc0;font-size:13px">Fireteam 5</button></div>
</div>
</section>
<div style="flex-grow:1"></div>
</div>
<div style="position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:10px;margin:0 8px;padding:8px 16px 24px;border-radius:20px 20px 0 0;background:#1f1f1f;flex-shrink:0">
<span style="position:relative;align-self:center;width:40px;height:5px;border-radius:3px;background:#444"></span>
<div style="position:relative;display:flex;justify-content:space-between;align-items:flex-end">
<div style="display:flex;flex-direction:column;align-items:flex-start"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#5fc4a0;line-height:1">0.81</span><span style="font-size:12px;color:#9a978f;display:flex;align-items:center;gap:6px">wounds / order</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-end"><span style="font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:700;color:#e59bc0;line-height:1">0.46</span><span style="font-size:12px;color:#9a978f;display:flex;align-items:center;gap:6px">wounds / order</span></div>
</div>
<div style="position:relative"><div style="display:flex;height:6px;border-radius:3px;overflow:hidden"><span style="width:23.6%;background:#1f6b52"></span><span style="width:24.0%;background:#87baa8"></span><span style="width:23.7%;background:#2e2e2e"></span><span style="width:14.7%;background:#e1b9ce"></span><span style="width:10.7%;background:#cc9ab4"></span><span style="width:3.0%;background:#b87a9b"></span><span style="width:0.2%;background:#a35b81"></span></div></div>
<div style="position:relative;display:flex;justify-content:space-between;font-size:12px;color:#8a877f"><span>47.7% at least one wound</span><span>28.6%</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}, "rest": {"editor": "number", "default": 0.16, "min": 0, "max": 1, "step": 0.02}, "lit": {"editor": "number", "default": 0.4, "min": 0, "max": 1, "step": 0.02}}'>
// Rest: ink-tinted in the side colour, faint. Tap a card's name (stands in for "this card is being edited",
// i.e. its picker or a weapon is in focus): the crest shows its own colours, a little stronger.
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lit: 'a' }; }
  renderVals() {
    var self = this, lit = this.state.lit, rest = this.props.rest ?? 0.16, on = this.props.lit ?? 0.4;
    function side(k) {
      var l = lit === k;
      return { op: l ? on : rest, filter: l ? 'none' : 'url(#ink-' + k + ')',
        tap: function () { self.setState({ lit: l ? null : k }); } };
    }
    return { a: side('a'), b: side('b') };
  }
}
</script>
</body>
</html>
