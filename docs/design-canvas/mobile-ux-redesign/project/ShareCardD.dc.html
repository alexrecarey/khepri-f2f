<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShareCardD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#121212;color:#e8e6e1}
a{color:#5fc4a0}a:hover{color:#8fe0c2}
</style>
</helmet>
<div style="width:1200px;height:1200px;box-sizing:border-box;position:relative;overflow:hidden;background:#121212;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px 70px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:'Chakra Petch',sans-serif;font-size:30px;font-weight:600;letter-spacing:.12em;color:#9a978f">INFINITY THE CALCULATOR</span><span style="font-size:36px;color:#9a978f">16–24″</span></div>
<div style="display:flex;align-items:center;gap:40px">
<div style="width:210px;height:210px;flex-shrink:0;border-radius:50%;border:6px solid #5fc4a0;background:#1c1c1c;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
<img src="crests/squalos-mk-ii.svg" alt="" aria-hidden="true" style="width:150px;height:150px"></div>
<div style="display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0">
<span style="font-family:'Chakra Petch',sans-serif;font-size:30px;font-weight:600;letter-spacing:.1em;color:#5fc4a0">ACTIVE</span>
<span style="font-size:60px;font-weight:600;line-height:1.05">Squalos Mk-II</span>
<span style="font-size:38px;color:#9a978f">HMG · Surprise attack</span>
</div>
<span style="font-family:'Chakra Petch',sans-serif;font-size:190px;font-weight:700;color:#5fc4a0;line-height:1">0.81</span>
</div>
<div style="display:flex;flex-direction:column;gap:18px"><div style="position:relative;display:flex;height:30px;border-radius:15px;overflow:hidden"><span style="width:23.6%;background:#1f6b52"></span><span style="width:24.0%;background:#87baa8"></span><span style="width:23.7%;background:#2e2e2e"></span><span style="width:14.7%;background:#e1b9ce"></span><span style="width:10.7%;background:#cc9ab4"></span><span style="width:3.0%;background:#b87a9b"></span><span style="width:0.3%;background:#a35b81"></span></div>
<div style="display:flex;justify-content:space-between;font-size:34px;color:#9a978f"><span><span style="color:#5fc4a0">48%</span> Squalos hits</span><span>24% no one</span><span><span style="color:#e59bc0">29%</span> Zhanshi hits</span></div></div>
<div style="display:flex;align-items:center;gap:40px">
<div style="width:210px;height:210px;flex-shrink:0;border-radius:50%;border:6px solid #e59bc0;background:#1c1c1c;display:flex;align-items:center;justify-content:center;box-sizing:border-box">
<img src="crests/zhanshi.svg" alt="" aria-hidden="true" style="width:150px;height:150px"></div>
<div style="display:flex;flex-direction:column;gap:4px;flex-grow:1;min-width:0">
<span style="font-family:'Chakra Petch',sans-serif;font-size:30px;font-weight:600;letter-spacing:.1em;color:#e59bc0">REACTIVE</span>
<span style="font-size:60px;font-weight:600;line-height:1.05">Zhanshi</span>
<span style="font-size:38px;color:#9a978f">Missile L. · Cover · Fireteam 5</span>
</div>
<span style="font-family:'Chakra Petch',sans-serif;font-size:190px;font-weight:700;color:#e59bc0;line-height:1">0.46</span>
</div>
<span style="font-size:36px;color:#9a978f;text-align:right">wounds per order</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1200, "height": 1200}}'>
// Share card exploration (Discord / WhatsApp). Flat fills, text and crest images only:
// the real card is drawn per link by the Worker, so no filters or masks.
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
