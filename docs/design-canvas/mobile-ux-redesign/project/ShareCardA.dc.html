<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShareCardA</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#121212;color:#e8e6e1}
a{color:#5fc4a0}a:hover{color:#8fe0c2}
</style>
</helmet>
<div style="width:1200px;height:630px;box-sizing:border-box;position:relative;overflow:hidden;background:#121212;display:flex;flex-direction:column;align-items:center;padding:44px 64px 40px">
<img src="crests/squalos-mk-ii.svg" alt="" aria-hidden="true" style="position:absolute;left:-170px;top:15px;width:600px;height:600px;opacity:0.4"><div style="position:absolute;left:0;top:0;bottom:0;width:470px;background:linear-gradient(90deg,rgba(18,18,18,0) 25%,#121212 100%)"></div><img src="crests/zhanshi.svg" alt="" aria-hidden="true" style="position:absolute;right:-170px;top:15px;width:600px;height:600px;opacity:0.4"><div style="position:absolute;right:0;top:0;bottom:0;width:470px;background:linear-gradient(270deg,rgba(18,18,18,0) 25%,#121212 100%)"></div>
<div style="position:relative"><span style="font-family:'Chakra Petch',sans-serif;font-size:30px;font-weight:600;letter-spacing:.12em;color:#9a978f">INFINITY THE CALCULATOR</span></div>
<div style="position:relative;flex-grow:1;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center">
<div style="display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px;min-width:0">
<span style="font-family:'Chakra Petch',sans-serif;font-size:150px;font-weight:700;color:#5fc4a0;line-height:.95">0.81</span>
<span style="font-size:46px;font-weight:600;line-height:1.1;margin-top:14px">Squalos Mk-II</span>
<span style="font-size:32px;color:#9a978f;line-height:1.2">HMG · Surprise attack</span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;min-width:0">
<span style="font-family:'Chakra Petch',sans-serif;font-size:150px;font-weight:700;color:#e59bc0;line-height:.95">0.46</span>
<span style="font-size:46px;font-weight:600;line-height:1.1;margin-top:14px">Zhanshi</span>
<span style="font-size:32px;color:#9a978f;line-height:1.2">Missile L. · Cover · FT 5</span>
</div>
</div>
<span style="position:relative;font-size:32px;color:#9a978f">wounds per order · 16–24″</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1200, "height": 630}}'>
// Share card exploration (Discord / WhatsApp). Flat fills, text and crest images only:
// the real card is drawn per link by the Worker, so no filters or masks.
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
